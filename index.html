<style>
  :root{
    --indigo-900:#181f38;
    --indigo-700:#2a3660;
    --indigo-600:#3a4a82;
    --sable-050:#faf3e6;
    --sable-100:#f0e2c8;
    --sable-200:#e4d0a6;
    --terre-cuite:#c0512e;
    --terre-cuite-dark:#9c3f22;
    --or-sahel:#e8a233;
    --vert-baobab:#3c6e49;
    --encre:#221b13;
    --blanc-casse:#fffaf1;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
  }
  body{
    background-color:var(--sable-050);
    color:var(--encre);
    font-family:var(--font-body);
    line-height:1.5;
    display:flex;
    flex-direction:column;
  }

  /* ---------- LAYOUT PRINCIPAL: FLEXBOX ---------- */
  #map-container {
    flex:1;
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
  }

  #map {
    width:100%;
    height:100%;
    z-index:1;
  }

  /* ---------- PANNEAUX FLOTTANTS (overlays) ---------- */
  .floating-panel {
    position:absolute;
    background:#fff;
    border:1px solid #ece0c4;
    border-radius:14px;
    box-shadow:0 4px 12px rgba(24,31,56,0.2);
    max-height:85vh;
    overflow-y:auto;
    z-index:100;
  }

  .search-panel {
    top:16px;
    left:16px;
    right:16px;
    width:auto;
    max-width:600px;
    padding:20px;
  }

  .results-panel {
    bottom:90px;
    right:16px;
    width:360px;
    max-width:calc(100vw - 32px);
    max-height:50vh;
    padding:20px;
  }

  @media (max-width:768px) {
    .search-panel {
      top:8px;
      left:8px;
      right:8px;
      max-width:none;
    }
    .results-panel {
      bottom:90px;
      left:8px;
      right:8px;
      width:auto;
      max-width:none;
      max-height:40vh;
    }
  }

  /* ---------- HEADER HERO (enlever de l'affichage de la carte) ---------- */
  .hero {
    display:none;
  }

  .foreword {
    display:none;
  }

  /* ---------- NAVIGATION BASSE (app-nav) ---------- */
  .app-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:500;
    background:var(--blanc-casse);
    border-top:1px solid #ece0c4;
    box-shadow:0 -8px 24px -12px rgba(24,31,56,0.25);
    display:flex;
    justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    height:auto;
  }
  .app-nav a{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    text-decoration:none;
    color:#a3966f;
    font-family:var(--font-body);
    font-size:10.5px;
    font-weight:600;
    padding:6px 8px;
    border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .app-nav a .nav-ic{font-size:19px;}
  .app-nav a.active{color:var(--terre-cuite-dark); background:var(--sable-100);}

  /* ---------- SEARCH CARD (panel flottant) ---------- */
  .search-card {
    background:var(--blanc-casse);
    border-radius:14px;
    border:1px solid #ece0c4;
    padding:16px;
  }
  .search-grid {
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:12px;
    align-items:end;
  }
  @media (max-width:480px) {
    .search-grid {
      grid-template-columns:1fr;
    }
  }
  .field label {
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:#8a7c5c;
    margin-bottom:4px;
  }
  select {
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid #e2d5b4;
    background:var(--sable-050) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9"><path d="M1 1l6 6 6-6" stroke="%23221b13" stroke-width="2" fill="none" stroke-linecap="round"/></svg>') no-repeat right 12px center;
    appearance:none;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    color:var(--encre);
    cursor:pointer;
  }
  select:focus, button:focus-visible {
    outline:3px solid var(--or-sahel);
    outline-offset:1px;
  }
  .go-btn {
    background:var(--terre-cuite);
    color:var(--blanc-casse);
    border:none;
    padding:10px 16px;
    border-radius:8px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .go-btn:hover {
    background:var(--terre-cuite-dark);
  }

  .mode-row {
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .mode-btn {
    flex:1;
    min-width:100px;
    display:flex;
    align-items:center;
    gap:6px;
    justify-content:center;
    padding:8px 10px;
    border-radius:8px;
    border:1.5px solid #e2d5b4;
    background:#fff;
    font-family:var(--font-body);
    font-weight:600;
    font-size:12px;
    color:#7a6c4d;
    cursor:pointer;
    transition:all .15s ease;
  }
  .mode-btn .ic {
    font-size:16px;
  }
  .mode-btn.active {
    border-color:transparent;
    color:#fff;
  }
  .mode-btn[data-mode="pied"].active {
    background:var(--vert-baobab);
  }
  .mode-btn[data-mode="car"].active {
    background:var(--or-sahel);
    color:var(--encre);
  }
  .mode-btn[data-mode="taxi"].active {
    background:var(--terre-cuite);
  }
  .mode-btn[data-mode="brt"].active {
    background:#2f7d5c;
  }
  .mode-btn[data-mode="ter"].active {
    background:var(--indigo-700);
  }
  .mode-btn[data-mode="urbain"].active {
    background:#8a5a2e;
  }

  /* ---------- RESULTS PANEL ---------- */
  .result-empty {
    padding:20px 10px;
    text-align:center;
    color:#a3966f;
    font-size:13px;
  }
  .stat-row {
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .stat {
    flex:1;
    background:var(--sable-050);
    border-radius:10px;
    padding:10px;
    text-align:center;
  }
  .stat .num {
    font-family:var(--font-mono);
    font-size:18px;
    font-weight:600;
    color:var(--indigo-900);
  }
  .stat .lab {
    font-size:10px;
    color:#8a7c5c;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .steps {
    list-style:none;
    margin:0;
    padding:0;
  }
  .steps li {
    display:flex;
    gap:10px;
    padding:10px 0;
    border-top:1px solid #f0e6cd;
  }
  .steps li:first-child {
    border-top:none;
  }
  .step-ic {
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--sable-100);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    flex-shrink:0;
  }
  .step-txt b {
    display:block;
    font-size:12px;
    margin-bottom:2px;
  }
  .step-txt p {
    margin:0;
    font-size:11px;
    color:#6c6248;
  }
  .phrase-tag {
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-top:4px;
    background:#f4e9cf;
    color:var(--terre-cuite-dark);
    font-family:var(--font-mono);
    font-size:11px;
    padding:2px 6px;
    border-radius:5px;
  }
  .mini-speak {
    border:none;
    background:var(--terre-cuite);
    color:#fff;
    width:16px;
    height:16px;
    border-radius:50%;
    font-size:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .warn {
    margin-top:10px;
    background:#fbeee2;
    border-left:3px solid var(--terre-cuite);
    padding:8px 10px;
    font-size:11px;
    border-radius:6px;
    color:#7a4326;
  }

  /* ---------- SECTIONS CACHÉES ---------- */
  .lex-section, .transit-section, .main-grid {
    display:none;
  }

  footer {
    display:none;
  }

  /* ---------- LEAFLET TWEAKS ---------- */
  .leaflet-popup-content {
    font-size:12px;
    font-family:var(--font-body);
  }
  .leaflet-popup-content b {
    font-family:var(--font-display);
  }
  .leaflet-popup-content .pc-communes {
    font-size:10px;
    color:#6c6248;
    margin-top:4px;
    max-width:220px;
  }

  /* ---------- GUIDE BOX (sur la carte) ---------- */
  .guide-box {
    position:absolute;
    bottom:90px;
    left:16px;
    background:#fff;
    border:1px solid #ece0c4;
    border-radius:12px;
    padding:12px;
    box-shadow:0 4px 12px rgba(24,31,56,0.2);
    z-index:100;
    max-width:280px;
  }
  .guide-row {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .guide-btn {
    flex:1;
    min-width:100px;
    background:var(--indigo-900);
    color:#fff;
    border:none;
    padding:8px 10px;
    border-radius:8px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:11px;
    cursor:pointer;
  }
  .guide-btn:hover:not(:disabled) {
    background:var(--indigo-700);
  }
  .guide-btn:disabled {
    opacity:0.45;
    cursor:not-allowed;
  }
  .guide-btn.active {
    background:var(--vert-baobab);
  }
  .guide-status {
    margin-top:8px;
    font-size:11px;
    color:#5a4f38;
    line-height:1.4;
  }
  .guide-status b {
    color:var(--indigo-900);
  }
  .user-dot {
    width:16px;
    height:16px;
    border-radius:50%;
    background:#2f7dff;
    border:3px solid #fff;
    box-shadow:0 0 0 4px rgba(47,125,255,0.35);
    animation:dotpulse 1.6s ease-in-out infinite;
  }
  @keyframes dotpulse {
    0%,100% {
      box-shadow:0 0 0 4px rgba(47,125,255,0.35);
    }
    50% {
      box-shadow:0 0 0 9px rgba(47,125,255,0.12);
    }
  }

  .wrap {
    display:none;
  }
</style>
</head>

  <div class="floating-panel search-panel">

          <label for="depart">Départ</label>

          <select id="arrivee"></select>
        </div>
        <button class="go-btn" id="go-btn">Chercher →</button>
      </div>
      <div class="mode-row">
        <button class="mode-btn" data-mode="pied"><span class="ic">🚶</span> Pied</button>

        <button class="mode-btn" data-mode="brt"><span class="ic">🚏</span> BRT</button>
        <button class="mode-btn" data-mode="ter"><span class="ic">🚆</span> TER</button>
        <button class="mode-btn" data-mode="urbain"><span class="ic">🚐</span> Bus</button>
      </div>
    </div>
  </div>

  <!-- PANNEAU DE RÉSULTATS FLOTTANT (bas à droite) -->
  <div class="floating-panel results-panel">
    <div id="results">
      <div class="result-empty">Aucun trajet calculé.<br>Choisissez deux villes 👆</div>
    </div>
  </div>

  <!-- GUIDE BOX (localisation et suivi) -->
  <div class="guide-box" id="guide-box">
    <div class="guide-row">
      <button class="guide-btn" id="locate-btn">📍 Me localiser</button>
      <button class="guide-btn" id="track-btn" disabled>🧭 Suivre</button>
    </div>
    <div id="guide-status" class="guide-status">Calculez un itinéraire, puis activez le suivi.</div>
  </div>
</div>

<nav class="app-nav" id="app-nav">

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/\(.*?\)/g,"").trim();
  const u = new SpeechSynthesisUtterance(clean);
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("fr"));
  if(frVoice) u.voice = frVoice;
  u.lang = "fr-FR";
  u.rate = 0.82;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

let routeLayer = null, animMarker = null, animFrame = null;
function clearRoute(){
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer=null; }
  if(animMarker){ map.removeLayer(animMarker); animMarker=null; }
  if(animFrame){ cancelAnimationFrame(animFrame); animFrame=null; }
}
function drawRouteOnMap(dep, arr, color, dash, icon){
  clearRoute();
  const latlngs = [[dep.lat,dep.lon],[arr.lat,arr.lon]];
  routeLayer = L.polyline(latlngs, {color, weight:4, dashArray:dash, lineCap:"round"}).addTo(map);
  map.fitBounds(routeLayer.getBounds(), {padding:[50,50]});

  const divIcon = L.divIcon({html:`<div style="font-size:22px;transform:translate(-50%,-50%);">${icon}</div>`, className:"", iconSize:[0,0]});
  animMarker = L.marker(latlngs[0], {icon:divIcon, interactive:false}).addTo(map);

  let start=null;
  const duration=3200;
  function step(ts){
    if(!start) start=ts;
    const t = ((ts-start)%duration)/duration;
    const lat = dep.lat + (arr.lat-dep.lat)*t;
    const lon = dep.lon + (arr.lon-dep.lon)*t;
    animMarker.setLatLng([lat,lon]);
    animFrame = requestAnimationFrame(step);
  }
  animFrame = requestAnimationFrame(step);
}

function haversine(a,b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLon=(b.lon-a.lon)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function formatDuration(hours){
  const totalMin = Math.round(hours*60);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  if(h===0) return `${m} min`;
  return `${h} h ${m.toString().padStart(2,"0")}`;
}

function computeRoute(){
  const dId = departSel.value, aId = arriveeSel.value;
  const dep = SEARCH_POINTS.find(c=>c.id===dId);
  const arr = SEARCH_POINTS.find(c=>c.id===aId);
  const resultsEl = document.getElementById("results");

  if(dId===aId){
    resultsEl.innerHTML = `<div class="result-empty">Choisissez deux points différents pour calculer un trajet.</div>`;
    clearRoute();
    resetMarkerStyles();
    return;
  }

  const distKm = haversine(dep,arr);
  const sameDept = dep.deptId===arr.deptId;
  const p = MODE_PARAMS[currentMode];
  const durationH = distKm / p.speed * (currentMode==="pied"?1:1.15);
  const price = currentMode==="pied" ? 0 : Math.round((p.base + distKm*p.pricePerKm)/50)*50);

  const modeLabel = {pied:"à pied", car:"en car", taxi:"en taxi", brt:"en BRT", ter:"en TER", urbain:"en bus urbain"}[currentMode];
  const phrase = MODE_PHRASE[currentMode];

  let warn = "";
  if(sameDept){
    warn += `<div class="warn">${dep.label} et ${arr.label} se trouvent dans le même département (${dep.deptName}) : à l'échelle de cette carte, la distance entre deux communes d'un même département n'est pas mesurable précisément — comptez un court trajet local (taxi urbain ou moto-taxi).</div>`;
  }
  if(currentMode==="pied" && distKm>25){
    warn += `<div class="warn">${Math.round(distKm)} km à pied représente plusieurs jours de marche — privilégiez un car ou un taxi pour ce trajet.</div>`;
  }
  if(p.urbanOnly && !(dep.region==="Dakar" && arr.region==="Dakar")){
    warn += `<div class="warn">${p.vehicule.replace(/^\S+\s/,"")} ne dessert pas directement ce trajet (réseau limité à l'agglomération de Dakar) — estimation indicative seulement. Choisissez « Car / sept-place » ou « Taxi » pour un trajet réel.</div>`;
  }

  resultsEl.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="num">${sameDept?"< 1":Math.round(distKm)}</div><div class="lab">km</div></div>
      <div class="stat"><div class="num">${sameDept?"—":formatDuration(durationH)}</div><div class="lab">durée est.</div></div>
      <div class="stat"><div class="num">${currentMode==="pied"||sameDept?"—":price.toLocaleString("fr-FR")}</div><div class="lab">${currentMode==="pied"?"gratuit":"FCFA est."}</div></div>
    </div>
    <ul class="steps">
      <li>
        <div class="step-ic">📍</div>
        <div class="step-txt">
          <b>Départ — ${dep.label}</b>
          <p>Rejoignez la gare routière ou l'arrêt le plus proche du centre-ville.</p>
        </div>
      </li>
      <li>
        <div class="step-ic">${p.icon}</div>
        <div class="step-txt">
          <b>Trajet ${modeLabel}</b>
          <p>Prenez ${p.vehicule} en direction de ${arr.label} (${arr.deptName}, ${arr.region}). ${sameDept?"":`Comptez ${formatDuration(durationH)} de trajet.`}</p>
          <span class="phrase-tag">🗣️ ${phrase.wolof}<button class="mini-speak" data-text="${esc(phrase.wolof)}" title="Écouter">🔊</button></span>
        </div>
      </li>
      <li>
        <div class="step-ic">🏁</div>
        <div class="step-txt">
          <b>Arrivée — ${arr.label}</b>
          <p>Vous êtes arrivé à ${arr.deptName}, région de ${arr.region}.</p>
        </div>
      </li>
    </ul>
    ${warn}
  `;

  resetMarkerStyles();
  markerById[dep.deptId].setStyle({radius:8, fillColor:"#c0512e", weight:2});
  markerById[arr.deptId].setStyle({radius:8, fillColor:"#c0512e", weight:2});

  const dash = currentMode==="pied" ? "2 7" : currentMode==="car" ? "10 6" : null;
  const strokeColor = {pied:"#3c6e49", car:"#e8a233", taxi:"#c0512e", brt:"#2f7d5c", ter:"#2a3660", urbain:"#8a5a2e"}[currentMode];
  drawRouteOnMap(dep, arr, strokeColor, dash, p.icon);

  currentDestination = arr;
  document.getElementById("track-btn").disabled = false;
}

function placeUserMarker(lat, lon){
  const icon = L.divIcon({html:'<div class="user-dot"></div>', className:"", iconSize:[16,16]});
  if(userMarker){ userMarker.setLatLng([lat,lon]); }

}

function bearing(a,b){
  const φ1=a.lat*Math.PI/180, φ2=b.lat*Math.PI/180;
  const λ1=a.lon*Math.PI/180, λ2=b.lon*Math.PI/180;
  const y=Math.sin(λ2-λ1)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(λ2-λ1);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function bearingToCardinal(deg){
  const dirs=["nord","nord-est","est","sud-est","sud","sud-ouest","ouest","nord-ouest"];
  return dirs[Math.round(deg/45)%8];
}

const guideStatus = document.getElementById("guide-status");
const locateBtn = document.getElementById("locate-btn");
const trackBtn = document.getElementById("track-btn");

locateBtn.addEventListener("click", ()=>{
  if(!("geolocation" in navigator)){
    guideStatus.innerHTML = "La géolocalisation n'est pas disponible sur cet appareil ou ce navigateur.";
    return;
  }
  guideStatus.innerHTML = "Localisation en cours…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude, longitude} = pos.coords;
    placeUserMarker(latitude, longitude);
    map.setView([latitude, longitude], 11);
    guideStatus.innerHTML = "Position trouvée — vous êtes affiché en bleu sur la carte.";
  }, err=>{
    guideStatus.innerHTML = `Localisation impossible (${err.message}). Vérifiez que vous avez autorisé l'accès à la position, et que la page est ouverte en HTTPS.`;
  }, {enableHighAccuracy:true, timeout:10000});
});

trackBtn.addEventListener("click", function(){
  if(watchId){
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    trackBtn.classList.remove("active");
    trackBtn.textContent = "🧭 Suivre";
    guideStatus.innerHTML = "Suivi en direct arrêté.";
    return;
  }
  if(!currentDestination){ guideStatus.innerHTML = "Calculez d'abord un itinéraire."; return; }
  if(!("geolocation" in navigator)){ guideStatus.innerHTML = "La géolocalisation n'est pas disponible."; return; }

  trackBtn.classList.add("active");
  trackBtn.textContent = "⏹️ Arrêter";
  guideStatus.innerHTML = "Recherche de votre position…";

  watchId = navigator.geolocation.watchPosition(pos=>{
    const {latitude, longitude} = pos.coords;
    placeUserMarker(latitude, longitude);
    const here = {lat:latitude, lon:longitude};
    const distLeft = haversine(here, currentDestination);
    const dir = bearingToCardinal(bearing(here, currentDestination));
    if(distLeft < 0.3){
      guideStatus.innerHTML = `🏁 Vous êtes arrivé près de <b>${currentDestination.label}</b> !`;
    } else {
      const distTxt = distLeft < 1 ? `${Math.round(distLeft*1000)} m` : `${distLeft.toFixed(1)} km`;
      guideStatus.innerHTML = `<b>${distTxt}</b> restants jusqu'à ${currentDestination.label}, en direction du <b>${dir}</b>.`;
    }
  }, err=>{
    guideStatus.innerHTML = `Suivi interrompu : ${err.message}`;
    trackBtn.classList.remove("active");
    trackBtn.textContent = "🧭 Suivre";
    watchId = null;
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
});

window.addEventListener("load", ()=>{
  setTimeout(()=>{
    const splash = document.getElementById("splash");
    if(splash) splash.classList.add("hide");
  }, 900);
});

computeRoute();
</script>
</body>
</html>
